<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificación de Certificado</title>
<style>
  :root{
    --azul-oscuro:#0f2a4a;
    --azul:#1a4d80;
    --dorado:#c9a24b;
    --gris:#5a6472;
    --bg:#eef1f5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--bg);
    display:flex;
    justify-content:center;
    padding:24px 16px;
    min-height:100vh;
  }
  .card{
    background:#fff;
    max-width:560px;
    width:100%;
    border-radius:14px;
    box-shadow:0 8px 30px rgba(15,42,74,0.15);
    overflow:hidden;
  }
  .header{
    background:linear-gradient(135deg, var(--azul-oscuro), var(--azul));
    color:#fff;
    padding:28px 24px;
    text-align:center;
  }
  .header .check{
    width:56px;height:56px;
    border-radius:50%;
    background:rgba(255,255,255,0.15);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 12px;
    font-size:28px;
  }
  .header h1{
    font-size:18px;
    margin:0;
    font-weight:600;
    letter-spacing:0.3px;
  }
  .header p{
    margin:6px 0 0;
    font-size:13px;
    opacity:0.85;
  }
  .body{
    padding:22px 24px 28px;
  }
  .field{
    padding:12px 0;
    border-bottom:1px solid #eef0f3;
  }
  .field:last-child{border-bottom:none;}
  .field .label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:var(--gris);
    margin-bottom:3px;
  }
  .field .value{
    font-size:15px;
    color:#1a1f29;
    font-weight:600;
    line-height:1.4;
  }
  .badge{
    display:inline-block;
    background:#f0f4f8;
    color:var(--azul-oscuro);
    border:1px solid #dbe3ec;
    border-radius:6px;
    padding:2px 10px;
    font-size:13px;
    font-weight:600;
  }
  .footer{
    padding:14px 24px;
    background:#f7f9fb;
    text-align:center;
    font-size:11px;
    color:var(--gris);
  }
  .error{
    padding:32px 24px;
    text-align:center;
    color:#a33;
  }
  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 16px;
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <!-- se llena por JS -->
  </div>

<script>
function decodeData() {
  const rawHash = window.location.hash.substring(1);
  if (!rawHash) return null;
  try {
    // El hash puede venir con caracteres percent-encoded (ej. %3D para '=')
    const b64 = decodeURIComponent(rawHash);
    const binary = atob(b64);
    const decoded = decodeURIComponent(escape(binary));
    return decoded.split('|');
  } catch (e) {
    return null;
  }
}

function render() {
  const card = document.getElementById('card');
  const data = decodeData();

  // Orden esperado (ajustar aquí si cambias la estructura al generar el QR):
  // 0 Emisor | 1 Organización / contexto | 2 Nombre | 3 Curso/Programa
  // 4 Norma | 5 Calificación | 6 Fecha inicio | 7 Fecha fin | 8 Horas | 9 N° Certificado

  if (!data || data.length < 10) {
    card.innerHTML = `
      <div class="header">
        <div class="check">✕</div>
        <h1>Certificado no válido</h1>
        <p>No se pudo leer la información del código QR</p>
      </div>
      <div class="error">
        Verifica que el enlace esté completo o vuelve a escanear el código QR.
      </div>`;
    return;
  }

  const [emisor, organizacion, nombre, curso, norma, calificacion, fechaInicio, fechaFin, horas, numCert] = data;

  card.innerHTML = `
    <div class="header">
      <div class="check">✓</div>
      <h1>Certificado Verificado</h1>
      <p>${emisor}</p>
    </div>
    <div class="body">
      <div class="field">
        <div class="label">Certificado a nombre de</div>
        <div class="value">${nombre}</div>
      </div>
      <div class="field">
        <div class="label">Programa / Curso</div>
        <div class="value">${curso}</div>
      </div>
      <div class="field">
        <div class="label">Contexto</div>
        <div class="value">${organizacion}</div>
      </div>
      <div class="field grid2">
        <div>
          <div class="label">Norma de referencia</div>
          <div class="value"><span class="badge">${norma}</span></div>
        </div>
        <div>
          <div class="label">Calificación</div>
          <div class="value">${calificacion}</div>
        </div>
      </div>
      <div class="field grid2">
        <div>
          <div class="label">Fecha de inicio</div>
          <div class="value">${fechaInicio}</div>
        </div>
        <div>
          <div class="label">Fecha de fin</div>
          <div class="value">${fechaFin}</div>
        </div>
      </div>
      <div class="field grid2">
        <div>
          <div class="label">Horas académicas</div>
          <div class="value">${horas} hrs</div>
        </div>
        <div>
          <div class="label">N° de certificado</div>
          <div class="value">${numCert}</div>
        </div>
      </div>
    </div>
    <div class="footer">
      Este certificado fue verificado electrónicamente el ${new Date().toLocaleDateString('es-PE')}
    </div>
  `;
}

render();
</script>
</body>
</html>
